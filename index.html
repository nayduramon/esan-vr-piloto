<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ESAN - Trayectoria histórica</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body>

<a-scene>

  <!-- ASSETS -->
  <a-assets>
    <img id="imgLobby" src="gth.jpeg">
    <img id="imgAuditorio" src="butacas.jpg">
    <video id="videoUni" src="video3.mp4" crossorigin="anonymous"
           playsinline webkit-playsinline></video>
  </a-assets>

  <!-- ENTORNOS -->
  <a-sky id="skyPrincipal"
         src="#imgLobby"
         radius="40"
         rotation="0 -90 0"
         class="detectable">
  </a-sky>

  <a-sky id="skyButacas"
         src="#imgAuditorio"
         radius="40"
         rotation="0 -90 0"
         visible="false">
  </a-sky>

  <!-- ================= PIN 1 : PINO ================= -->
  <a-entity id="pinPino" position="-35.3 18.0 -5.0">

    <a-circle id="iconoPino"
              class="clickable"
              radius="0.8"
              color="#BD0000"
              look-at="[camera]">
      <a-text value="📍"
              align="center"
              color="#FFFFFF"
              width="2"
              position="0 0 0.01">
      </a-text>
    </a-circle>

    <a-entity id="nubePino"
              visible="false"
              position="0 2.2 0"
              look-at="[camera]">

      <a-plane width="10"
               height="4.5"
               color="#FFFFFF"
               opacity="0.95"
               material="shader: flat">
      </a-plane>

      <a-text
        value="El pino simboliza el vínculo de ESAN\ncon la Universidad de Stanford,\ncuyo emblema lleva un pino\ncomo elemento central."
        color="#000000"
        width="9"
        align="center"
        position="0 0 0.01">
      </a-text>

    </a-entity>
  </a-entity>

  <!-- ================= PIN 2 : HISTORIA ================= -->
  <a-entity id="pinHistoria" position="-26.7 8.0 -28.6">

    <a-circle id="iconoHistoria"
              class="clickable"
              radius="0.8"
              color="#7BF502"
              look-at="[camera]">
      <a-text value="📍"
              align="center"
              color="#000000"
              width="2"
              position="0 0 0.01">
      </a-text>
    </a-circle>

    <a-entity id="nubeHistoria"
              visible="false"
              position="0 2.2 0"
              look-at="[camera]">

      <a-plane width="9"
               height="3.5"
               color="#FFFFFF"
               opacity="0.95"
               material="shader: flat">
      </a-plane>

      <a-text
        value="En esta etapa se consolidan los\nprimeros programas académicos."
        color="#000000"
        width="8"
        align="center"
        position="0 0 0.01">
      </a-text>

    </a-entity>
  </a-entity>

  <!-- CAPA OSCURECER -->
  <a-entity id="oscurecerButacas"
            geometry="primitive: sphere; radius: 39"
            material="shader: flat; color: black; side: back; transparent: true; opacity: 0"
            visible="false">
  </a-entity>

  <!-- VIDEO -->
  <a-video id="pantallaVideo"
           src="#videoUni"
           width="30"
           height="10"
           position="-27.5 2.5 -11.7"
           look-at="[camera]"
           visible="false"
           material="shader: flat; toneMapped: false"
           animation__entrar="property: scale; from: 0 0 0; to: 1 1 1;
                              dur: 3000; easing: easeOutQuad; startEvents: videoEntra">
  </a-video>

  <!-- BOTÓN -->
  <a-entity id="contenedorBoton"
            position="0 1.6 -15"
            animation="property: position; to: 0 1.6 -2.5;
                       dur: 8000; easing: easeOutCubic; delay: 500">

    <a-circle id="btnAccion"
              class="clickable"
              color="#000"
              opacity="0.7"
              radius="0.7">

      <a-text id="textoBoton"
              value="CONOCE NUESTRA\nHISTORIA"
              align="center"
              color="#FFFFFF"
              width="1">
      </a-text>

    </a-circle>
  </a-entity>

  <!-- CÁMARA -->
  <a-entity id="rig">
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: false; rayOrigin: mouse"
                raycaster="objects: .clickable, .detectable">
      </a-entity>
    </a-entity>
  </a-entity>

</a-scene>

<script>
/* TOGGLE PINES */
iconoPino.addEventListener('click', () => {
  nubePino.setAttribute('visible', !nubePino.getAttribute('visible'));
});

iconoHistoria.addEventListener('click', () => {
  nubeHistoria.setAttribute('visible', !nubeHistoria.getAttribute('visible'));
});
</script>

</body>
</html>
