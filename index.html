<!-- PIN DE UBICACIÓN + NUBE DE TEXTO -->
<a-entity id="puntoPino" position="-35.3 16.5 -5.0">

  <!-- PIN -->
  <a-sphere
    id="iconoPino"
    class="clickable"
    radius="0.35"
    color="#E10600">
  </a-sphere>

  <!-- NUBE -->
  <a-plane
    id="nubePino"
    width="8"
    height="4"
    color="#FFFFFF"
    position="0 2 0"
    visible="false"
    look-at="[camera]"
    material="shader: flat; opacity: 0.95">

    <a-text
      value="El pino simboliza el vínculo de ESAN\ncon la Universidad de Stanford,\ncuyo emblema lleva un pino como\nelemento central."
      color="#000000"
      align="center"
      width="7"
      position="0 0 0.01">
    </a-text>

  </a-plane>

</a-entity>
