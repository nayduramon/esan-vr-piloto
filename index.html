<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ESAN - Trayectoria histórica</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body>

<a-scene>

  <!-- ASSETS -->
  <a-assets>
    <img id="imgLobby" src="gth.jpeg">
    <img id="imgAuditorio" src="butacas.jpg">
    <video id="videoUni" src="video3.mp4" crossorigin="anonymous"
           playsinline webkit-playsinline></video>
  </a-assets>

  <!-- ENTORNOS -->
  <a-sky id="skyPrincipal"
         src="#imgLobby"
         radius="40"
         rotation="0 -90 0"
         class="detectable">
  </a-sky>

  <a-sky id="skyButacas"
         src="#imgAuditorio"
         radius="40"
         rotation="0 -90 0"
         visible="false">
  </a-sky>
  <!-- TEXTO 1: PINO -->
<a-text
  id="textoPino"
  value="El pino simboliza el vínculo de ESAN\ncon la Universidad de Stanford,\ncuyo emblema lleva un pino\ncomo elemento central."
  position="-12.3 3.2 25.6"
  color="#FFFFFF"
  width="7"
  align="center"
  look-at="[camera]">
</a-text>

  <!-- TEXTO 2: HISTORIA -->
<a-text
  id="textoHistoria"
  value="En esta etapa se consolidan los primeros programas académicos."
  position="10.5 2.8 -30.2"
  color="#FFD700"
  width="7"
  align="center"
  look-at="[camera]">
</a-text>


  <!-- CAPA OSCURECER BUTACAS -->
  <a-entity id="oscurecerButacas"
            geometry="primitive: sphere; radius: 39"
            material="shader: flat; color: black; side: back; transparent: true; opacity: 0"
            visible="false">
  </a-entity>

  <!-- VIDEO -->
  <a-video id="pantallaVideo"
           src="#videoUni"
           width="30"
           height="10"
           position="-27.5 2.5 -11.7"
           look-at="[camera]"
           visible="false"
           material="shader: flat; toneMapped: false"
           animation__entrar="property: scale; from: 0 0 0; to: 1 1 1;
                              dur: 3000; easing: easeOutQuad; startEvents: videoEntra">
  </a-video>

  <!-- TEXTO DETECTADO (PRUEBA) -->
  <a-text id="textoDetectado"
          value="El pino simboliza el vínculo de ESAN con la Universidad de Stanford, cuyo emblema lleva un pino como elemento central."
          color="#FFD700"
          width="6"
          align="center"
          visible="false"
          look-at="[camera]">
  </a-text>

  <!-- BOTÓN -->
  <a-entity id="contenedorBoton"
            position="0 1.6 -15"
            animation="property: position; to: 0 1.6 -2.5;
                       dur: 8000; easing: easeOutCubic; delay: 500">

    <a-circle id="btnAccion"
              class="clickable"
              color="#000"
              opacity="0.7"
              radius="0.7">

      <a-text id="textoBoton"
              value="CONOCE NUESTRA\nHISTORIA"
              align="center"
              color="#FFFFFF"
              width="1"
              wrap-count="20">
      </a-text>

    </a-circle>
  </a-entity>

  <!-- CÁMARA -->
  <a-entity id="rig">

    <a-entity camera look-controls position="0 1.6 0">

      <a-entity cursor="fuse: false; rayOrigin: mouse"
                raycaster="objects: .clickable, .detectable">
      </a-entity>

    </a-entity>

    <a-entity laser-controls="hand: right"
              raycaster="objects: .clickable, .detectable; far: 50">
    </a-entity>

    <a-entity laser-controls="hand: left"
              raycaster="objects: .clickable, .detectable; far: 50">
    </a-entity>

  </a-entity>

</a-scene>

<script>

const video = document.querySelector('#videoUni');
const pantalla = document.querySelector('#pantallaVideo');
const contenedorBtn = document.querySelector('#contenedorBoton');
const btnAccion = document.querySelector('#btnAccion');
const textoBoton = document.querySelector('#textoBoton');
const skyPrincipal = document.querySelector('#skyPrincipal');
const skyButacas = document.querySelector('#skyButacas');
const oscurecerButacas = document.querySelector('#oscurecerButacas');
const textoDetectado = document.querySelector('#textoDetectado');

const animacionEntrada =
  "property: position; to: 0 1.6 -2.5; dur: 8000; easing: easeOutCubic; delay: 500";

// CLICK BOTÓN (VIDEO)
btnAccion.addEventListener('click', () => {

  contenedorBtn.setAttribute('visible', false);

  skyPrincipal.setAttribute('visible', false);
  skyButacas.setAttribute('visible', true);

  oscurecerButacas.setAttribute('visible', true);
  oscurecerButacas.setAttribute('material', 'opacity', 0.85);

  video.currentTime = 0;
  pantalla.setAttribute('visible', true);

  setTimeout(() => {
    pantalla.emit('videoEntra');
    video.play();
  }, 500);
});

// FIN DEL VIDEO
video.addEventListener('ended', () => {

  pantalla.setAttribute('visible', false);
  skyButacas.setAttribute('visible', false);
  skyPrincipal.setAttribute('visible', true);

  oscurecerButacas.setAttribute('material', 'opacity', 0);
  oscurecerButacas.setAttribute('visible', false);

  textoBoton.setAttribute('value', 'VUELVE A VER\nNUESTRA\nHISTORIA');

  contenedorBtn.setAttribute('visible', true);
  contenedorBtn.setAttribute('position', '0 1.6 -15');
  contenedorBtn.removeAttribute('animation');

  setTimeout(() => {
    contenedorBtn.setAttribute('animation', animacionEntrada);
  }, 50);
});

// 🔥 DETECTOR DE COORDENADAS EN gth.jpeg
skyPrincipal.addEventListener('click', (evt) => {

  const p = evt.detail.intersection.point;

  console.log('📍 Coordenadas detectadas');
  console.log(`x: ${p.x.toFixed(2)} y: ${p.y.toFixed(2)} z: ${p.z.toFixed(2)}`);

  textoDetectado.setAttribute('position', p);
  textoDetectado.setAttribute(
    'value',
    `X:${p.x.toFixed(1)} Y:${p.y.toFixed(1)} Z:${p.z.toFixed(1)}`
  );
  textoDetectado.setAttribute('visible', true);
});

</script>

</body>
</html>
