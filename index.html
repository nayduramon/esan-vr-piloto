<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ESAN 360 - Trayectoria histórica</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
 
  <a-scene>
<a-assets>
<img id="esan360" src="gth.jpeg">
<video id="videoUni" 
             src="video.mp4" 
             loop="false" 
             crossorigin="anonymous"
             playsinline
             webkit-playsinline>
</video>
</a-assets>
 
    <a-sky src="#esan360" rotation="0 -90 0"></a-sky>
 
    <a-sphere id="telonNegro"
              radius="10"
              material="color: #000; side: back; transparent: true; opacity: 0; shader: flat"
              animation__oscurecer="property: material.opacity; to: 0.9; dur: 2000; startEvents: cineStart; easing: easeInOutQuad"
              animation__aclarar="property: material.opacity; to: 0; dur: 2000; startEvents: cineEnd; easing: easeInOutQuad">
</a-sphere>
 
    <a-video id="pantallaVideo" 
             src="#videoUni" 
             width="4" 
             height="2.25"
             position="0 1.6 -20"
             visible="false"
             animation__entrar="property: position; to: 0 1.6 -4; dur: 2000; easing: easeOutBack; startEvents: videoEntra"
             animation__salir="property: position; to: 0 1.6 -20; dur: 1500; easing: easeInQuad; startEvents: videoSale">
</a-video>
 
    <a-entity id="contenedorBoton" 
              position="0 1.6 -10" 
              visible="true"
              animation="property: position; to: 0 1.6 -2.5; dur: 2500; easing: easeOutElastic; elasticity: 400">
<a-circle id="btnAccion"
                class="clickable"
                color="#000000" 
                opacity="0.6" 
                radius="0.65"
                animation__mouseenter="property: scale; to: 1.1 1.1 1; dur: 200; startEvents: mouseenter"
                animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
<a-text id="textoBoton"
                value="CONOCE NUESTRA\nHISTORIA" 
                align="center" 
                color="#FFFFFF" 
                font="kelsonsans"
                width="1" 
                wrap-count="20"
                anchor="center"
                baseline="center">
</a-text>
</a-circle>
</a-entity>
 
    <a-entity camera look-controls position="0 1.6 0">
<a-cursor id="cursor" 
                color="yellow" 
                raycaster="objects: .clickable"
                animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150">
</a-cursor>
</a-entity>
 
  </a-scene>
 
  <script>
    const video = document.querySelector('#videoUni');
    const pantalla = document.querySelector('#pantallaVideo');
    const contenedorBtn = document.querySelector('#contenedorBoton');
    const btnAccion = document.querySelector('#btnAccion');
    const textoBoton = document.querySelector('#textoBoton');
    const telonNegro = document.querySelector('#telonNegro');
 
    // --- AL HACER CLIC EN EL BOTÓN ---
    btnAccion.addEventListener('click', function() {
      // 1. Ocultar el botón
      contenedorBtn.setAttribute('visible', 'false');
 
      // 2. Iniciar Modo Cine (oscurecer fondo)
      telonNegro.emit('cineStart');
 
      // 3. Preparar video y mostrar pantalla (aún lejos)
      video.muted = false;
      video.currentTime = 0;
      pantalla.setAttribute('visible', 'true');
      // 4. Animar la entrada del video (de lejos a cerca)
      pantalla.emit('videoEntra');
 
      // 5. Reproducir
      // Damos un pequeño delay para que empiece mientras se acerca
      setTimeout(() => {
        video.play();
      }, 800);
    });
 
    // --- AL TERMINAR EL VIDEO ---
    video.addEventListener('ended', function() {
      // 1. Quitar Modo Cine
      telonNegro.emit('cineEnd');
 
      // 2. Alejar la pantalla
      pantalla.emit('videoSale');
 
      // 3. Restaurar botón
      setTimeout(() => {
        pantalla.setAttribute('visible', 'false');
        // Cambiar texto
        textoBoton.setAttribute('value', 'VUELVE A VER\nNUESTRA\nHISTORIA');
        contenedorBtn.setAttribute('visible', 'true');
        // Reiniciar animación de entrada del botón
        contenedorBtn.setAttribute('position', '0 1.6 -10');
        // Forzamos un reinicio de la animación si el componente lo permite,
        // o simplemente al cambiar la posición y tener la animación activa, 
        // A-Frame intentará interpolar de nuevo.
        contenedorBtn.components.animation.animation.restart();
      }, 1500); 
    });
</script>
</body>
</html>
